<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>即将离开本站 · zhilinOfficial Blog</title>
  <meta name="description" content="您即将跳转到第三方页面，请确认后继续访问。" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='60' font-family='system-ui' font-weight='700'%3EJ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=50" />
  <style>
    .redirect-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 24px 0;
    }
    .redirect-card {
      width: 100%;
      max-width: 560px;
      padding: 36px;
      border: 1px solid #e5e5e5;
      border-radius: 28px;
      background: #ffffff;
      text-align: center;
    }
    .redirect-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f5f5f5;
      color: #111111;
    }
    .redirect-icon svg {
      width: 28px;
      height: 28px;
    }
    .redirect-card h1 {
      font-size: 1.6rem;
      margin: 0 0 10px;
    }
    .redirect-card .eyebrow {
      margin: 0 0 22px;
    }
    .redirect-target {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 1px dashed #d0d0d0;
      border-radius: 14px;
      background: #fafafa;
      color: #424242;
      font-size: 0.92rem;
      word-break: break-all;
      text-align: left;
      line-height: 1.5;
    }
    .redirect-notice {
      margin: 0 0 14px;
      color: #424242;
      font-size: 0.95rem;
      line-height: 1.7;
      text-align: left;
    }
    .redirect-reason {
      margin: 0 0 28px;
      padding: 14px 16px;
      border-left: 3px solid #111111;
      background: #f8f8f8;
      color: #424242;
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: left;
      border-radius: 0 12px 12px 0;
    }
    .redirect-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .redirect-actions .button {
      min-width: 120px;
    }
    .redirect-actions .button.primary {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }
    .redirect-actions .button.primary:hover {
      background: #333333;
      border-color: #333333;
    }
    .redirect-error {
      color: #8f8f8f;
      font-size: 0.95rem;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .redirect-card {
        padding: 26px 20px;
      }
      .redirect-actions {
        flex-direction: column;
      }
      .redirect-actions .button {
        width: 100%;
      }
    }

    @media (prefers-color-scheme: dark) {
      body:not([data-theme="light"]) .redirect-card {
        border-color: #2a2a2a;
        background: #1a1a1a;
      }
      body:not([data-theme="light"]) .redirect-icon {
        background: #2a2a2a;
        color: #ffffff;
      }
      body:not([data-theme="light"]) .redirect-target {
        border-color: #3a3a3a;
        background: #111111;
        color: #d0d0d0;
      }
      body:not([data-theme="light"]) .redirect-notice,
      body:not([data-theme="light"]) .redirect-reason {
        color: #d0d0d0;
      }
      body:not([data-theme="light"]) .redirect-reason {
        background: #222222;
        border-left-color: #ffffff;
      }
      body:not([data-theme="light"]) .redirect-actions .button.primary {
        background: #ffffff;
        color: #111111;
        border-color: #ffffff;
      }
      body:not([data-theme="light"]) .redirect-actions .button.primary:hover {
        background: #e5e5e5;
        border-color: #e5e5e5;
        color: #111111;
      }
      body:not([data-theme="light"]) .redirect-actions .button:not(.primary) {
        border-color: #3a3a3a;
        color: #e0e0e0;
      }
      body:not([data-theme="light"]) .redirect-actions .button:not(.primary):hover {
        border-color: #ffffff;
        background: #222222;
        color: #ffffff;
      }
    }

    body[data-theme="dark"] .redirect-card {
      border-color: #2a2a2a;
      background: #1a1a1a;
    }
    body[data-theme="dark"] .redirect-icon {
      background: #2a2a2a;
      color: #ffffff;
    }
    body[data-theme="dark"] .redirect-target {
      border-color: #3a3a3a;
      background: #111111;
      color: #d0d0d0;
    }
    body[data-theme="dark"] .redirect-notice,
    body[data-theme="dark"] .redirect-reason {
      color: #d0d0d0;
    }
    body[data-theme="dark"] .redirect-reason {
      background: #222222;
      border-left-color: #ffffff;
    }
    body[data-theme="dark"] .redirect-actions .button.primary {
      background: #ffffff;
      color: #111111;
      border-color: #ffffff;
    }
    body[data-theme="dark"] .redirect-actions .button.primary:hover {
      background: #e5e5e5;
      border-color: #e5e5e5;
      color: #111111;
    }
    body[data-theme="dark"] .redirect-actions .button:not(.primary) {
      border-color: #3a3a3a;
      color: #e0e0e0;
    }
    body[data-theme="dark"] .redirect-actions .button:not(.primary):hover {
      border-color: #ffffff;
      background: #222222;
      color: #ffffff;
    }
  </style>
</head>
<body data-page="redirect">
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="avatar.jpg" alt="zhilinOfficial" />
        <div>
          <p class="eyebrow">zhilinOfficial</p>
          <h1>个人博客</h1>
        </div>
      </div>
      <nav class="nav-links" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="articles.html">文章</a>
        <a href="about.html">关于</a>
      </nav>
    </header>

    <main>
      <div class="redirect-shell">
        <section class="redirect-card" aria-live="polite">
          <div class="redirect-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </div>
          <h1>即将离开本站</h1>
          <p class="eyebrow">外部链接跳转确认</p>
          <p id="redirectTarget" class="redirect-target"></p>
          <p class="redirect-notice">您即将访问第三方网站。我们无法保证该页面的安全性、内容准确性或隐私保护策略，请谨慎判断并自行决定是否继续访问。</p>
          <p id="redirectReason" class="redirect-reason"></p>
          <div class="redirect-actions">
            <a id="continueBtn" class="button primary" href="#" target="_blank" rel="noreferrer noopener">继续访问</a>
            <a class="button" href="index.html">返回首页</a>
          </div>
          <p id="redirectError" class="redirect-error" style="display:none;">未提供有效的跳转目标，请返回首页。</p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p>zhilinOfficial Blog · 2026</p>
    </footer>
  </div>

  <script src="page-transition.js?v=45"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const rawUrl = params.get('url');
      const reason = params.get('reason') || '这是站外推荐链接，点击后将前往第三方页面。';
      const targetEl = document.getElementById('redirectTarget');
      const reasonEl = document.getElementById('redirectReason');
      const continueBtn = document.getElementById('continueBtn');
      const errorEl = document.getElementById('redirectError');

      function isValidHttpUrl(string) {
        try {
          const url = new URL(string);
          return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (_) {
          return false;
        }
      }

      if (rawUrl && isValidHttpUrl(rawUrl)) {
        targetEl.textContent = rawUrl;
        reasonEl.textContent = reason;
        continueBtn.href = rawUrl;
      } else {
        targetEl.style.display = 'none';
        reasonEl.style.display = 'none';
        continueBtn.style.display = 'none';
        errorEl.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
